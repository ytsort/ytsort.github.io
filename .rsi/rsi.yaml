schema: hydra-rsi/1
# Committed bytes the static landing page serves (HTML, images, text files) and the size of index.html itself.
# Smaller means a faster first visit; both are read from git HEAD so they are exact.
metrics:
  - id: site.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'shipped_bytes=(\d+)'
    gate: exact
    light: true
  - id: site.index_html_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'index_html_bytes=(\d+)'
    gate: exact
    light: true
